name: Global News Video Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: global-news-video-pipeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-video-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          IMAGE_API_BASE_URL: ${{ secrets.IMAGE_API_BASE_URL }}
          IMAGE_RATIO: ${{ secrets.IMAGE_RATIO }}
          VIDEO_API_BASE_URL: ${{ secrets.VIDEO_API_BASE_URL }}
          VIDEO_HIGH_RES: ${{ secrets.VIDEO_HIGH_RES }}
          VIDEO_DURATION_SECONDS: ${{ secrets.VIDEO_DURATION_SECONDS }}
          VIDEO_HEIGHT: ${{ secrets.VIDEO_HEIGHT }}
          VIDEO_WIDTH: ${{ secrets.VIDEO_WIDTH }}
          VIDEO_INFERENCE_STEPS: ${{ secrets.VIDEO_INFERENCE_STEPS }}
          VIDEO_NEGATIVE_PROMPT: ${{ secrets.VIDEO_NEGATIVE_PROMPT }}
          VIDEO_GUIDANCE_HIGH: ${{ secrets.VIDEO_GUIDANCE_HIGH }}
          VIDEO_GUIDANCE_LOW: ${{ secrets.VIDEO_GUIDANCE_LOW }}
          VIDEO_QUALITY: ${{ secrets.VIDEO_QUALITY }}
          VIDEO_SCHEDULER: ${{ secrets.VIDEO_SCHEDULER }}
          VIDEO_FLOW_SHIFT: ${{ secrets.VIDEO_FLOW_SHIFT }}
          VIDEO_FPS: ${{ secrets.VIDEO_FPS }}
          VIDEO_DISPLAY_RESULT: ${{ secrets.VIDEO_DISPLAY_RESULT }}
          VIDEO_EVENT_TIMEOUT_SECONDS: ${{ secrets.VIDEO_EVENT_TIMEOUT_SECONDS }}
          PIPELINE_MAX_NEWS: 8
          PYTHONPATH: today-international-news
        run: python -m today_international_news.main

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A today-international-news/
          git diff --cached --quiet && exit 0
          git commit -m "Generate global news video package"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
