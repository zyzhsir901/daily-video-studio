name: Global News Video Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  generate-video-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_NAME: ${{ secrets.OPENAI_MODEL_NAME }}
          IMAGE_API_BASE_URL: ${{ secrets.IMAGE_API_BASE_URL }}
          IMAGE_RATIO: ${{ secrets.IMAGE_RATIO }}
          VIDEO_API_BASE_URL: ${{ secrets.VIDEO_API_BASE_URL }}
          VIDEO_HIGH_RES: ${{ secrets.VIDEO_HIGH_RES }}
          VIDEO_DURATION_SECONDS: ${{ secrets.VIDEO_DURATION_SECONDS }}
          PIPELINE_MAX_NEWS: 8
        run: python -m src.today_international_news.main

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A today-international-news/
          git diff --cached --quiet && exit 0
          git commit -m "Generate global news video package"
          git push
