name: Daily Building Video Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  generate-building-video:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: daily-building-video-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          BUILDING_SEGMENT_COUNT: ${{ secrets.BUILDING_SEGMENT_COUNT }}
          IMAGE_API_BASE_URL: ${{ secrets.IMAGE_API_BASE_URL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_RATIO: ${{ secrets.IMAGE_RATIO }}
          VIDEO_API_BASE_URL: ${{ secrets.VIDEO_API_BASE_URL }}
          VIDEO_API_KEY: ${{ secrets.VIDEO_API_KEY }}
          VIDEO_DURATION_SECONDS: ${{ secrets.VIDEO_DURATION_SECONDS }}
        run: python -m src.daily_building_video.main

      - name: Commit generated assets
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A daily-building-video-agent/building-video-runs/
          git diff --cached --quiet && exit 0
          git commit -m "Generate daily building video package"
          git push
